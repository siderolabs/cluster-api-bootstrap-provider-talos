# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Bootstrap Provider Talos"
github_repo = "siderolabs/cluster-api-bootstrap-provider-talos"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.6.11"

pre_release = true

[notes]

[notes.CAPI]
    title = "CAPI"
    description = """\
CABPT is now compatible with CAPI v1.12.0+ (v1beta2).
"""

[notes.talosconfig]
    title = "TalosConfig status.talosConfig removed"
    description = """\
TalosConfig no longer reports a talosconfig in `status.talosConfig`; the field is not part of the
`v1beta1` API and stays empty when read through `v1alpha3`.
Use the cluster-wide `<cluster-name>-talosconfig` secret instead (key `talosconfig`).
"""

[notes.deprecatedstatus]
    title = "TalosConfig status.deprecated.v1beta1"
    description = """\
The deprecated v1beta1 status of TalosConfig `v1beta1` moved from `status.deprecated.v1beta` to
`status.deprecated.v1beta1`, matching the Cluster API convention.
When upgrading from any of v0.7.0-alpha.1 through v0.7.0-alpha.3, the old field is dropped and the deprecated
conditions are reported again on the next reconciliation.
"""

[notes.Talos]
    title = "Talos 1.14"
    description = """\
CABPT is now compatible with Talos v1.14.0+.
"""

preface = """\
"""
